<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Painel de câmeras offline – Multiwey Sentry</title>
<script>if(['127.0.0.1','localhost','::1'].includes(location.hostname))document.write('<script src="/socket.io/socket.io.js"><\/script>');</script>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
<script src="/phone-utils.js"></script>
<style>
:root{--bg:#eef1ef;--panel:#fff;--ink:#17211f;--mut:#5d6b68;--line:#d5dcd9;--brand:#0f5c57;--brandfg:#fff;--red:#c8372d;--redbg:#fbe7e5;--amb:#9a6208;--ambbg:#fbf0d9;--blu:#245a9e;--blubg:#e3edf9;--grn:#26734d;--grnbg:#e0f2e8;--wa:#dcf8c6;--chat:#e9e4da;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#10171a;--panel:#18222a;--ink:#e6eeec;--mut:#98a9a5;--line:#2c3a42;--brand:#4fb5ab;--brandfg:#08201e;--red:#ff8a80;--redbg:#3a1d1d;--amb:#f0b95a;--ambbg:#392c12;--blu:#8dbbf0;--blubg:#162a42;--grn:#7ccf9f;--grnbg:#14301f;--wa:#1f4a35;--chat:#1c2429;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#10171a;--panel:#18222a;--ink:#e6eeec;--mut:#98a9a5;--line:#2c3a42;--brand:#4fb5ab;--brandfg:#08201e;--red:#ff8a80;--redbg:#3a1d1d;--amb:#f0b95a;--ambbg:#392c12;--blu:#8dbbf0;--blubg:#162a42;--grn:#7ccf9f;--grnbg:#14301f;--wa:#1f4a35;--chat:#1c2429;color-scheme:dark}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.45 "IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif}
button,input,textarea{font:inherit;color:inherit}
.app{display:grid;grid-template-columns:230px 1fr;min-height:100vh}
aside{background:#031B34;border-right:1px solid var(--line);padding:20px 12px;position:sticky;top:0;align-self:start;height:100vh;color:#e6eeec}
.logo{font-weight:600;font-size:16px;padding:0 10px 4px;color:#e6eeec}
.sub{color:#98a9a5;font-size:13px;padding:0 10px 18px}
.nav-label{display:flex;align-items:center;gap:10px}
.nav-label .bi{font-size:15px;opacity:.9;min-width:16px;text-align:center}
nav button{display:flex;width:100%;justify-content:space-between;align-items:center;gap:8px;background:none;border:0;border-left:3px solid transparent;padding:10px 10px;text-align:left;cursor:pointer;border-radius:0 6px 6px 0;color:#e6eeec}
nav button:hover{background:rgba(255,255,255,.08)}
nav button.on{border-left-color:var(--brand);background:rgba(255,255,255,.12);font-weight:600}
nav .n{min-width:24px;text-align:center;font-size:12px;border-radius:10px;padding:1px 7px;background:rgba(255,255,255,.15);color:#e6eeec}
nav button[data-k=offline] .n{background:var(--redbg);color:var(--red)}
nav button[data-k=notificado] .n{background:var(--ambbg);color:var(--amb)}
nav button[data-k=analisando] .n{background:var(--blubg);color:var(--blu)}
nav button[data-k=aguardando] .n{background:var(--ambbg);color:var(--amb)}
nav button[data-k=resolvido] .n{background:var(--grnbg);color:var(--grn)}
.themebtn{margin:18px 10px 0;font-size:13px;color:#98a9a5;background:none;border:1px solid rgba(255,255,255,.2);border-radius:6px;padding:6px 10px;cursor:pointer;display:block;width:calc(100% - 20px);text-align:center}
main{padding:24px;max-width:1100px;width:100%}
h1{font-size:22px;margin:0 0 4px}
.lead{color:var(--mut);margin:0 0 18px;max-width:62ch}
.note{background:var(--ambbg);color:var(--amb);border-radius:6px;padding:8px 12px;font-size:13px;margin-bottom:18px}
.kpis{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:20px}
.kpi{background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:10px 14px;min-width:130px}
.kpi b{display:block;font-size:22px;font-weight:600}
.kpi span{color:var(--mut);font-size:13px}
.two{display:grid;grid-template-columns:1fr 300px;gap:20px;align-items:start}
.box{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:16px}
.box h2{font-size:15px;margin:0 0 12px}
.flow{display:flex;flex-wrap:wrap;gap:8px;align-items:stretch;margin:14px 0}
.flow-step{flex:1 1 130px;min-width:130px;background:var(--panel);border:1px solid var(--line);border-left:4px solid var(--c,var(--brand));border-radius:8px;padding:10px 12px;cursor:pointer;text-align:left;color:var(--ink)}
.flow-step:hover{background:var(--bg)}
.flow-step b{display:block;font-size:14px}
.flow-step span{display:block;color:var(--mut);font-size:12px;margin-top:2px}
.flow-split{flex:2 1 280px;display:flex;gap:8px}
.flow-split .flow-step{flex:1 1 130px}
.flow-arrow{align-self:center;color:var(--mut);font-size:18px}
label{display:block;font-size:13px;color:var(--mut);margin:10px 0 3px}
input,textarea{width:100%;border:1px solid var(--line);background:var(--bg);border-radius:6px;padding:8px 10px}
input:focus,textarea:focus,button:focus-visible{outline:2px solid var(--brand);outline-offset:1px}
.btn{border:1px solid var(--line);background:var(--panel);border-radius:6px;padding:7px 12px;cursor:pointer;font-weight:500}
.btn:hover{background:var(--bg)}
.btn.p{background:var(--brand);color:var(--brandfg);border-color:var(--brand)}
.btn.p:hover{filter:brightness(1.1)}
.btn.s{padding:5px 10px;font-size:13px}
.grp{background:var(--panel);border:1px solid var(--line);border-left:4px solid var(--c,var(--line));border-radius:8px;padding:14px 16px;margin-bottom:12px}
.grp.offline{--c:var(--red)}.grp.notificado,.grp.validacao{--c:var(--amb)}.grp.analisando{--c:var(--blu)}.grp.aguardando{--c:var(--amb)}.grp.resolvido{--c:var(--grn)}
.gh{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;align-items:baseline}
.gh b{font-size:16px}.gh span{color:var(--mut);font-size:13px}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin:10px 0}
.chip{font-size:13px;border:1px solid var(--line);background:var(--bg);border-radius:5px;padding:2px 8px}
.act{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.sim{font-size:12px;color:var(--mut);margin-right:2px}
.tag{font-size:12px;border-radius:5px;padding:2px 8px}
.tag.r{background:var(--redbg);color:var(--red)}.tag.b{background:var(--blubg);color:var(--blu)}.tag.g{background:var(--grnbg);color:var(--grn)}.tag.a{background:var(--ambbg);color:var(--amb)}
.empty{border:1px dashed var(--line);border-radius:8px;padding:28px;text-align:center;color:var(--mut)}
.phone{background:var(--chat);border-radius:14px;padding:12px;border:1px solid var(--line)}
.bub{background:var(--wa);border-radius:8px 8px 8px 2px;padding:9px 11px;font-size:14px;white-space:pre-wrap}
.wbtn{display:block;width:100%;margin-top:6px;background:var(--panel);border:0;border-radius:8px;padding:8px;color:var(--blu);font-weight:500;text-align:center}
.chat{background:var(--chat);border-radius:8px;padding:10px;margin-top:10px;max-height:240px;overflow:auto;display:flex;flex-direction:column;gap:6px}
.m{max-width:80%;padding:6px 10px;border-radius:8px;font-size:14px;background:var(--panel)}
.m.tec{align-self:flex-end;background:var(--wa)}
.m.sys{align-self:center;font-size:12px;color:var(--mut);background:none}
.m small{display:block;color:var(--mut);font-size:11px}
.send{display:flex;gap:8px;margin-top:8px}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:9px 16px;border-radius:8px;font-size:14px;opacity:0;pointer-events:none;transition:opacity .2s;z-index:5;max-width:90%}
.toast.on{opacity:1}
main.noc-full{max-width:none;padding:0}
.chip .x{border:0;background:none;cursor:pointer;color:var(--mut);padding:0 0 0 6px;font-size:15px;line-height:1}
.dgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:16px;margin-bottom:16px}
.rk{display:grid;grid-template-columns:140px 1fr 28px;gap:8px;align-items:center;font-size:14px;margin:8px 0}
.rk span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rk i{display:block;height:10px;border-radius:5px}
.rk b{text-align:right;font-weight:600}
.lg{display:flex;gap:14px;font-size:13px;color:var(--mut);margin-bottom:6px;flex-wrap:wrap}
.lg b{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:5px}
svg text{fill:var(--mut);font-size:11px;font-family:inherit}
.gl{stroke:var(--line);stroke-width:1}
.ln{fill:none;stroke:var(--brand);stroke-width:2.5;stroke-linejoin:round}
.ar{fill:var(--brand);opacity:.12}
.dot{fill:var(--brand)}
.bn{fill:var(--red)}
.br{fill:var(--grn)}
.dn{color:var(--grn)}.up{color:var(--red)}
@keyframes fadeSlide{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.04)}}
.grp{animation:fadeSlide .25s cubic-bezier(0.23,1,0.32,1) both}
.kpi{transition:transform .15s cubic-bezier(0.23,1,0.32,1),box-shadow .15s}
.kpi:hover{transform:translateY(-2px)}
.btn{transition:transform .12s cubic-bezier(0.23,1,0.32,1),filter .12s}
.btn:active{transform:scale(.97)}
.chip{transition:transform .12s cubic-bezier(0.23,1,0.32,1)}
.chip:hover{transform:translateY(-1px)}
.toast{transition:opacity .2s cubic-bezier(0.23,1,0.32,1),transform .2s cubic-bezier(0.23,1,0.32,1)}
@media (prefers-reduced-motion:reduce){.grp,.kpi,.btn,.chip,.toast{animation:none;transition:none}}
@media (hover:hover) and (pointer:fine){.btn:hover{filter:brightness(1.05)}}
@media (max-width:820px){.app{grid-template-columns:1fr}aside{position:static;height:auto;border-right:0;border-bottom:1px solid var(--line)}nav{display:flex;overflow-x:auto}nav button{border-left:0;border-bottom:3px solid transparent;white-space:nowrap;width:auto;border-radius:0}nav button.on{border-bottom-color:var(--brand)}.two{grid-template-columns:1fr}main{padding:16px}}
</style>
</head>
<body>
<div class="app">
<aside>
 <div class="logo"><img src="logo-sentry.png" alt="Sentry" style="max-width:180px;height:auto;display:block"></div>
 <nav id="nav"></nav>
 <button class="themebtn" id="theme">Alternar tema</button>
 <button class="themebtn" id="logout" style="display:none">Sair</button>
</aside>
<main>
 <div id="view"></div>
</main>
</div>
<div class="toast" id="toast"></div>
<!--__NOC_PAINEL_INICIO__-->
<template id="nocPainelTemplate">
<style>
:root,:host{
    --bg:#0b1120; --panel:#111a2e; --panel2:#0e1626; --border:#1e2a44;
    --text:#e2e8f0; --muted:#8ea0bd; --accent:#38bdf8;
    --green:#22c55e; --yellow:#eab308; --orange:#f97316; --red:#ef4444; --darkred:#b91c1c; --purple:#a855f7;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body,:host{display:block;background:var(--bg);color:var(--text);font-family:"Segoe UI",system-ui,-apple-system,sans-serif;font-size:14px}
  .wrap{max-width:1500px;margin:0 auto;padding:20px}
  header{display:flex;flex-wrap:wrap;align-items:baseline;gap:12px;margin-bottom:6px}
  header h1{font-size:22px;font-weight:700}
  header h1 .dot{display:inline-block;width:10px;height:10px;border-radius:50%;background:var(--red);margin-right:8px;box-shadow:0 0 8px var(--red);animation:pulse 1.6s infinite}
  @keyframes pulse{50%{opacity:.4}}
  .sub{color:var(--muted);font-size:12px;margin-bottom:18px}
  /* KPIs */
  .kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-bottom:18px}
  .kpi{background:var(--panel);border:1px solid var(--border);border-radius:10px;padding:14px 16px}
  .kpi .v{font-size:26px;font-weight:700;line-height:1.2}
  .kpi .l{color:var(--muted);font-size:12px;margin-top:2px}
  .kpi.red .v{color:var(--red)} .kpi.green .v{color:var(--green)} .kpi.yellow .v{color:var(--yellow)}
  .kpi.orange .v{color:var(--orange)} .kpi.purple .v{color:var(--purple)} .kpi.blue .v{color:var(--accent)}
  /* Charts */
  .charts{display:grid;grid-template-columns:1.4fr 1fr 1fr;gap:12px;margin-bottom:18px}
  @media(max-width:1000px){.charts{grid-template-columns:1fr}}
  .card{background:var(--panel);border:1px solid var(--border);border-radius:10px;padding:16px}
  .card h3{font-size:13px;text-transform:uppercase;letter-spacing:.5px;color:var(--muted);margin-bottom:12px}
  .bar-row{display:grid;grid-template-columns:170px 1fr 42px;align-items:center;gap:8px;margin-bottom:7px;font-size:12px}
  .bar-row .name{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;text-align:right;color:var(--text)}
  .bar-track{background:var(--panel2);border-radius:4px;height:16px;overflow:hidden}
  .bar-fill{height:100%;border-radius:4px;background:linear-gradient(90deg,#0ea5e9,#38bdf8);min-width:2px}
  .bar-row .num{font-weight:600;color:var(--accent)}
  .sev-row{display:grid;grid-template-columns:130px 1fr 42px;align-items:center;gap:8px;margin-bottom:9px;font-size:12px}
  .legend{display:flex;flex-direction:column;gap:7px;font-size:12px;margin-top:10px}
  .legend .li{display:flex;align-items:center;gap:8px}
  .legend .sw{width:11px;height:11px;border-radius:3px;flex:none}
  .legend .cnt{margin-left:auto;font-weight:600}
  .donut-wrap{display:flex;justify-content:center;padding:6px 0}
  .donut{width:150px;height:150px;border-radius:50%;position:relative}
  .donut::after{content:"";position:absolute;inset:28px;border-radius:50%;background:var(--panel)}
  .donut .center{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:1}
  .donut .center b{font-size:22px} .donut .center span{font-size:10px;color:var(--muted)}
  /* Filters */
  .filters{display:flex;flex-wrap:wrap;gap:10px;align-items:center;background:var(--panel);border:1px solid var(--border);border-radius:10px;padding:12px 14px;margin-bottom:14px}
  .filters input[type=search]{flex:1;min-width:220px;background:var(--panel2);border:1px solid var(--border);color:var(--text);border-radius:7px;padding:8px 12px;font-size:13px;outline:none}
  .filters input[type=search]:focus{border-color:var(--accent)}
  .filters select{background:var(--panel2);border:1px solid var(--border);color:var(--text);border-radius:7px;padding:8px 10px;font-size:13px;outline:none;max-width:230px}
  .btn{background:var(--panel2);border:1px solid var(--border);color:var(--text);border-radius:7px;padding:8px 14px;font-size:13px;cursor:pointer;transition:.15s}
  .btn:hover{border-color:var(--accent);color:var(--accent)}
  .btn.active{background:var(--accent);color:#04121f;border-color:var(--accent);font-weight:600}
  .count-info{color:var(--muted);font-size:12px;margin-left:auto}
  /* Table */
  .table-card{background:var(--panel);border:1px solid var(--border);border-radius:10px;overflow:hidden}
  .table-scroll{overflow:auto;max-height:70vh}
  table{width:100%;border-collapse:collapse;font-size:12.5px}
  thead th{position:sticky;top:0;background:#16213a;color:var(--muted);text-transform:uppercase;font-size:10.5px;letter-spacing:.4px;padding:10px 10px;text-align:left;cursor:pointer;user-select:none;white-space:nowrap;border-bottom:1px solid var(--border);z-index:2}
  thead th:hover{color:var(--accent)}
  thead th .arrow{color:var(--accent)}
  tbody td{padding:8px 10px;border-bottom:1px solid #16203a;vertical-align:top}
  tbody tr:hover{background:#152036}
  td.nome{max-width:420px;font-weight:500}
  td.resp{max-width:230px;color:var(--muted);font-size:11.5px}
  .badge{display:inline-block;padding:2px 9px;border-radius:20px;font-size:11px;font-weight:600;white-space:nowrap}
  .b-off{background:rgba(239,68,68,.15);color:#f87171;border:1px solid rgba(239,68,68,.4)}
  .b-on{background:rgba(34,197,94,.15);color:#4ade80;border:1px solid rgba(34,197,94,.4)}
  .sev{display:inline-block;padding:2px 9px;border-radius:6px;font-size:11px;font-weight:600;white-space:nowrap;color:#fff}
  .sla{font-weight:700}
  .sla.g{color:var(--green)} .sla.y{color:var(--yellow)} .sla.o{color:var(--orange)} .sla.r{color:var(--red)}
  .tag{display:inline-block;background:var(--panel2);border:1px solid var(--border);color:var(--muted);border-radius:5px;padding:1px 7px;font-size:10.5px;white-space:nowrap}
  .muted{color:var(--muted)}
  .num-cell{text-align:right;font-variant-numeric:tabular-nums}
  /* Municipality summary */
  .mun-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:10px;padding:14px}
  .mun-card{background:var(--panel2);border:1px solid var(--border);border-radius:9px;padding:12px 14px;cursor:pointer;transition:.15s}
  .mun-card:hover{border-color:var(--accent)}
  .mun-card h4{font-size:13px;margin-bottom:6px}
  .mun-card .stats{display:flex;gap:12px;font-size:11.5px;color:var(--muted)}
  .mun-card .stats b{color:var(--text)}
  .mun-card .off b{color:var(--red)}
  footer{color:var(--muted);font-size:11.5px;text-align:center;margin:18px 0 6px}
.modal-back{position:fixed;inset:0;background:rgba(0,0,0,.55);display:flex;align-items:center;justify-content:center;padding:16px;z-index:1000}
.modal{background:var(--panel);border:1px solid var(--border);border-radius:12px;max-width:920px;width:100%;padding:16px;box-shadow:0 20px 60px rgba(0,0,0,.35)}
.modal-head{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:8px}
.modal-head h3{margin:0;font-size:16px}
.hidden{display:none!important}
</style>
<div class="wrap">
  <header>
    <h1><span class="dot"></span>Painel NOC — Monitoramento de Câmeras</h1>
  </header>
  <div class="sub" id="subtitulo"></div>

  <div class="kpis" id="kpis"></div>

  <div class="charts">
    <div class="card">
      <h3>Top municípios — câmeras offline</h3>
      <div id="chartMunicipios"></div>
    </div>
    <div class="card">
      <h3>Tempo offline (severidade)</h3>
      <div id="chartSeveridade"></div>
    </div>
    <div class="card">
      <h3>Categorias</h3>
      <div class="donut-wrap"><div class="donut" id="donut"><div class="center"><b id="donutTotal"></b><span>câmeras</span></div></div></div>
      <div class="legend" id="legendCategorias"></div>
    </div>
  </div>

  <div class="filters">
    <input type="search" id="busca" placeholder="🔍 Buscar por nome, ID, município, responsável...">
    <select id="fMunicipio"><option value="">Todos os municípios</option></select>
    <select id="fCategoria"><option value="">Todas as categorias</option></select>
    <select id="fSeveridade">
      <option value="">Qualquer tempo offline</option>
      <option value="s0">Recente (&lt; 1h)</option>
      <option value="s1">1h – 24h</option>
      <option value="s2">1 – 3 dias</option>
      <option value="s3">3 – 7 dias</option>
      <option value="s4">Crítico (&gt; 7 dias)</option>
    </select>
    <select id="fStatus">
      <option value="">Online + Offline</option>
      <option value="Offline" selected>Somente Offline</option>
      <option value="Online">Somente Online</option>
      <option value="Resolvido">Somente Resolvidos</option>
    </select>
    <button class="btn active" id="btnTabela">📋 Tabela</button>
    <button class="btn" id="btnMunicipios">🏙️ Municípios</button>
    <button class="btn" id="btnLeitura">🤖 Leitura de dados</button>
    <button class="btn" id="btnDarBaixa">✔ Dar baixa nos selecionados</button>
    <button class="btn" id="btnAgrupar">👥 Agrupar IDs em responsável</button>
    <button class="btn" id="btnEnviarOffline">➡️ Enviar offline ao painel</button>
    <button class="btn" id="btnExport">⬇️ Exportar CSV</button>
    <button class="btn" id="btnLimpar">✖ Limpar</button>
    <span class="count-info" id="countInfo"></span>
  </div>

  <div class="modal-back hidden" id="agruparModal">
    <div class="modal">
      <div class="modal-head">
        <h3>Agrupar câmeras em um responsável</h3>

    const k=d.municipio||'SEM MUNICÍPIO';
    const m=agg[k]||(agg[k]={municipio:k,total:0,offline:0,online:0,desc24:0,sla:0,max:0});
    m.total++; m.desc24+=Number(d.desc24)||0; m.sla+=Number(d.slaTotal)||0;
    if(pendente(d)){ m.offline++; m.max=Math.max(m.max, Number(d.offlineMin)||0); }
    else m.online++;
  });
  return Object.values(agg).map(m=>({
    municipio:m.municipio,total:m.total,offline:m.offline,online:m.online,
    desc24:m.desc24,sla: m.total?Math.round(m.sla/m.total):0,maxOfflineMin:m.max
  })).sort((a,b)=>b.offline-a.offline||a.municipio.localeCompare(b.municipio,'pt-BR'));
}

let sortKey='offlineMin', sortDir=-1;
const COLS = [
  {k:'_sel',      l:'', nosort:true},
  {k:'id',        l:'ID'},
  {k:'nome',      l:'Câmera / Local'},
  {k:'municipio', l:'Município'},
  {k:'categoria', l:'Categoria'},
  {k:'responsaveis', l:'Responsáveis', nosort:true},
  {k:'status',    l:'Status'},
  {k:'offlineMin',l:'Tempo offline'},
  {k:'ultimo',    l:'Último status'},
  {k:'desc24',    l:'Desc. 24h'},
  {k:'sla24',     l:'SLA 24h'},
  {k:'slaTotal',  l:'SLA total'},
  {k:'_ac',       l:'Ação', nosort:true},
];

function filtrar(){
  const q = norm($('busca').value);
  const fm=$('fMunicipio').value, fc=$('fCategoria').value, fs=$('fSeveridade').value, fst=$('fStatus').value;
  let out = data.filter(d=>{
    if(fst && d.status!==fst) return false;
    if(fm && d.municipio!==fm) return false;
    if(fc && d.categoria!==fc) return false;
    if(fs){ const s=sevDe(d); if(!s||s.key!==fs) return false; }
    if(q){
      const hay=norm([d.idTexto,d.nome,d.municipio,d.categoria,d.responsaveis.join(' '),d.marcadores].join(' '));
      if(!hay.includes(q)) return false;
    }
    return true;
  });
  out.sort((a,b)=>{
    let va=a[sortKey], vb=b[sortKey];
    if(sortKey==='ultimo'){ va=a.ultimoTs||0; vb=b.ultimoTs||0; }
    if(Array.isArray(va)){ va=va.join(' '); vb=vb.join(' '); }
    if(typeof va==='string') return sortDir*va.localeCompare(vb,'pt-BR');
    return sortDir*((va||0)-(vb||0));
  });
  return out;
}

function renderTabela(){
  const rows = filtrar();
  $('theadRow').innerHTML = COLS.map(c=>{
    const arrow = c.k===sortKey ? ` <span class="arrow">${sortDir>0?'▲':'▼'}</span>` : '';
    return `<th data-k="${c.k}" ${c.nosort?'data-nosort="1"':''}>${c.l}${arrow}</th>`;
  }).join('');
  $('tbody').innerHTML = rows.map(d=>{
    const s = sevDe(d);
    const id = esc(d.idTexto||d.id);
    const statusB = d.status==='Online' ? '<span class="badge b-on">● Online</span>'
      : d.status==='Resolvido' ? '<span class="badge b-on">✔ Resolvido</span>'
      : '<span class="badge b-off">● Offline</span>';
    const tempo = pendente(d) && s
      ? `<span class="sev" style="background:${s.color}">${esc(d.offlineStr)}</span>`
      : '<span class="muted">—</span>';
    const resp = d.responsaveis.length ? esc(d.responsaveis.join(' · ')) : '<span class="muted">— sem responsável —</span>';
    const tag = d.marcadores ? ` <span class="tag">${esc(d.marcadores)}</span>` : '';
    const acao = pendente(d) ? `<button class="btn" data-baixa="${id}">Dar baixa</button>` : '<span class="muted">—</span>';
    return `<tr>
      <td>${pendente(d)?`<input type="checkbox" class="noc-sel" value="${id}" aria-label="Selecionar ID ${id}">`:''}</td>
      <td class="num-cell muted">${esc(d.idTexto)}</td>
      <td class="nome">${esc(d.nome)}${tag}</td>
      <td>${esc(d.municipio)}</td>
      <td><span class="tag">${esc(d.categoria)}</span></td>
      <td class="resp">${resp}</td>
      <td>${statusB}</td>
      <td>${tempo}</td>
      <td class="muted" style="white-space:nowrap">${esc(d.ultimo)||'—'}</td>
      <td class="num-cell ${d.desc24>=100?'sla r':d.desc24>=10?'sla o':''}">${d.desc24.toLocaleString('pt-BR')}</td>
      <td class="num-cell sla ${slaClass(d.sla24)}">${d.sla24}%</td>
      <td class="num-cell sla ${slaClass(d.slaTotal)}">${d.slaTotal}%</td>
      <td>${acao}</td>
    </tr>`;
  }).join('');
  $('tbody').querySelectorAll('[data-baixa]').forEach(btn=>{
    btn.onclick=()=>darBaixa([btn.dataset.baixa]);
  });
  $('countInfo').textContent = `${rows.length} de ${data.length} câmeras`;
  $('theadRow').querySelectorAll('th').forEach(th=>{
    if(th.dataset.nosort) return;
    th.onclick=()=>{
      const k=th.dataset.k;
      if(sortKey===k) sortDir*=-1; else { sortKey=k; sortDir = (k==='nome'||k==='municipio'||k==='categoria'||k==='id')?1:-1; }
      renderTabela();
    };
  });
}

/* ---------- Baixa, agrupamento e dedupe ---------- */
function atualizarDepoisDeAcao(mensagem){
  stats = calcularStats(data, { geradoEm: new Date().toLocaleString('pt-BR'), arquivoFonte: stats.arquivoFonte });
  resumoMunicipios = calcularResumoMunicipios(data);
  PAYLOAD.stats = stats; PAYLOAD.data = data; PAYLOAD.resumoMunicipios = resumoMunicipios;
  renderDashboard();
  mostrar($('viewTabela').classList.contains('hidden') ? 'municipios' : 'tabela');
  prepararLeituraParaSalvar(stats.arquivoFonte);
  if(mensagem && $('leituraStatus')) $('leituraStatus').textContent = mensagem;
}
function darBaixa(ids, observacao){
  const alvo = new Set((Array.isArray(ids)?ids:[ids]).map(chaveId).filter(Boolean));
  if(!alvo.size) return 0;
  const agora = new Date();
  const dataResolucao = agora.toISOString().slice(0,10);
  const obs = String(observacao||'').trim() || `Baixa dada no Painel NOC em ${agora.toLocaleString('pt-BR')}`;
  const afetadas = [];
  for(const d of data){
    if(!alvo.has(chaveId(d.idTexto||d.id))) continue;
    d.status = 'Resolvido';
    d.dataResolucao = dataResolucao;
    d.observacao = [d.observacao, obs].filter(Boolean).join(' | ').slice(0, MAX_CAMPO_CSV);
    d.offlineMin = 0; d.offlineStr = '';
    afetadas.push(d.idTexto||d.id);
  }
  if(!afetadas.length) return 0;
  atualizarDepoisDeAcao(`${afetadas.length} câmera(s) baixada(s) como Resolvido. Salve a leitura para persistir ou aguarde a sincronização com o aplicativo.`);
  window.dispatchEvent(new CustomEvent('noc:baixa',{detail:{ids:afetadas,dataResolucao,observacao:obs}}));
  return afetadas.length;
}
function idsSelecionadas(){
  return [...($('tbody')?.querySelectorAll('input.noc-sel:checked')||[])].map(el=>el.value);
}
function popularResponsaveisAgrupamento(){
  const sel = $('agruparResponsavel');
  if(!sel) return;
  const mapa = new Map();
  const add = (nome, telefone) => {
    const n = String(nome||'').trim();
    if(!n || n.toUpperCase()==='SEM RESPONSÁVEL INFORMADO') return;
    const k = norm(n) + '::' + chaveTelefone(telefone);
    if(!mapa.has(k)) mapa.set(k, {nome:n, telefone:String(telefone||'')});
  };
  for(const r of responsaveisCadastrados) add(r.nome, r.telefone);
  for(const d of data) for(const nome of (Array.isArray(d.responsaveis)?d.responsaveis:[])) add(nome, d.telefone||'');
  const atual = sel.value;
  sel.innerHTML = '<option value="">— selecionar responsável existente —</option>' + [...mapa.values()]
    .sort((a,b)=>a.nome.localeCompare(b.nome,'pt-BR'))
    .map((r,i)=>`<option value="${i}" data-nome="${esc(r.nome)}" data-telefone="${esc(r.telefone)}">${esc(r.nome)}${r.telefone?` · ${esc(r.telefone)}`:''}</option>`)
    .join('');
  if(atual && sel.querySelector(`option[value="${CSS.escape(atual)}"]`)) sel.value = atual;
}
function abrirAgrupar(){
  popularResponsaveisAgrupamento();
  const ids = idsSelecionadas();
  const campo = $('agruparIds');
  if(campo) campo.value = ids.join('; ');
  const status = $('agruparStatus');
  if(status) status.textContent = ids.length
    ? `${ids.length} ID(s) selecionada(s) na tabela. Você pode acrescentar ou remover IDs antes de enviar.`
    : 'Nenhuma ID selecionada na tabela. Digite as IDs abaixo.';
  $('agruparModal')?.classList.remove('hidden');
}
function fecharAgrupar(){ $('agruparModal')?.classList.add('hidden'); }
function itensOffline(){
  return (Array.isArray(data)?data:[]).filter(pendente).map(d=>({
    id:d.idTexto||d.id,
    nome:d.nome,
    municipio:d.municipio,
    responsaveis:Array.isArray(d.responsaveis)?d.responsaveis.join(' | '):(d.responsaveis||''),
    marcadores:Array.isArray(d.marcadores)?d.marcadores.join(' | '):(d.marcadores||''),
    status:d.status,
    ultimo:d.ultimo,
    tempo:d.offlineStr||'',
    desc24:d.desc24,
    sla24:d.sla24,
    slaTotal:d.slaTotal
  }));
}
function agruparIdsEmResponsavel(){
  const bruto = $('agruparIds')?.value||'';
  const ids = [...new Set(bruto.split(/[\s,;]+/).map(x=>x.trim()).filter(Boolean))];
  if(!ids.length){ $('agruparStatus').textContent='Informe ao menos uma ID de câmera.'; return; }
  const selecionado = $('agruparResponsavel')?.selectedOptions?.[0];
  const nomeExistente = selecionado?.dataset?.nome || '';
  const telExistente = selecionado?.dataset?.telefone || '';
  const nome = String($('agruparNome')?.value||'').trim() || nomeExistente;
  const telefone = String($('agruparTelefone')?.value||'').trim() || telExistente;
  if(!nome){ $('agruparStatus').textContent='Escolha um responsável existente ou digite um novo nome.'; return; }
  const alvo = new Set(ids.map(chaveId));
  let vinculadas = 0;
  for(const d of data){
    if(!alvo.has(chaveId(d.idTexto||d.id))) continue;
    d.responsaveis = [nome];
    d.telefone = telefone;
    vinculadas++;
  }
  if(!vinculadas){ $('agruparStatus').textContent='Nenhuma ID informada foi encontrada no painel.'; return; }
  atualizarDepoisDeAcao(`${vinculadas} ID(s) agrupada(s) em ${nome} e enviada(s) ao Offline. Nenhuma mensagem foi enviada automaticamente.`);
  window.dispatchEvent(new CustomEvent('noc:offline',{detail:{
    items:itensOffline(),
    groups:[{responsavel_nome:nome, responsavel_telefone:telefone, cameraIds:ids}]
  }}));
  fecharAgrupar();
}
async function carregarIdsCadastradas(){
  if(Array.isArray(window.__nocIdsCadastradas)) return;
  try{
    const resp = await fetch('/api/cameras',{credentials:'same-origin'});
    if(!resp.ok) return;
    const lista = await resp.json();
    if(!Array.isArray(lista)) return;
    idsCadastradas = new Set(lista.map(c=>chaveId(c.id)).filter(Boolean));
    const porNome = new Map();
    for(const c of lista){
      const nome = String(c.responsavel_nome||'').trim();
      const tel = String(c.responsavel_telefone||'').trim();
      if(!nome || !tel || nome.toUpperCase()==='SEM RESPONSÁVEL INFORMADO') continue;
      const k = norm(nome)+'::'+chaveTelefone(tel);
      if(!porNome.has(k)) porNome.set(k,{nome,telefone:tel});
    }
    responsaveisCadastrados = [...porNome.values()];
    window.__nocIdsCadastradas = lista.map(c=>c.id);
  }catch(e){ /* painel standalone sem API: segue sem dedupe remoto */ }
}
if(window.__nocIdsHandler) window.removeEventListener('noc:ids', window.__nocIdsHandler);
window.__nocIdsHandler = e=>{
  const detail = e.detail||{};
  idsCadastradas = new Set((Array.isArray(detail.ids)?detail.ids:[]).map(chaveId).filter(Boolean));
  responsaveisCadastrados = Array.isArray(detail.responsaveis)?detail.responsaveis:[];
  window.__nocIdsCadastradas = Array.isArray(detail.ids)?detail.ids:[];
};
window.addEventListener('noc:ids', window.__nocIdsHandler);

// IDs já cadastradas no aplicativo e IDs repetidas no arquivo são ignoradas:
// o cadastro atual prevalece e a contagem aparece no resumo da leitura.
function filtrarLinhasLidas(lidas){
  const vistas = new Set();
  const parsed = [];
  let ignoradasCadastradas = 0, duplicadasNoArquivo = 0;
  for(const n of (Array.isArray(lidas)?lidas:[])){
    const k = chaveId(n.idTexto||n.id);
    if(idsCadastradas.has(k)){ ignoradasCadastradas++; continue; }
    if(vistas.has(k)){ duplicadasNoArquivo++; continue; }
    vistas.add(k); parsed.push(n);
  }
  return { parsed, ignoradasCadastradas, duplicadasNoArquivo };
}

/* ---------- Export CSV ---------- */
function exportar(){
  const rows=filtrar();
  const head='ID;Nome;Município;Categoria;Responsáveis;Marcadores;Status;Data resolução;Observação;Último status;Tempo offline;Desconexões 24h;SLA 24h;SLA total';
  const lines=rows.map(d=>[d.id,d.nome,d.municipio,d.categoria,d.responsaveis.join(' | '),d.marcadores,d.status,d.dataResolucao||'',d.observacao||'',d.ultimo,d.offlineStr,d.desc24,d.sla24+'%',d.slaTotal+'%']
    .map(v=>`"${String(v??'').replace(/"/g,'""')}"`).join(';'));
  const blob=new Blob(['﻿'+[head,...lines].join('\r\n')],{type:'text/csv;charset=utf-8'});
  const a=document.createElement('a');
  a.href=URL.createObjectURL(blob); a.download='noc-filtrado.csv'; a.click();
  URL.revokeObjectURL(a.href);
}

function normKey(k){ return norm(k).replace(/[^A-Z0-9]/g,''); }
function pick(row, keys){
  const map={}; for(const [k,v] of Object.entries(row||{})) map[normKey(k)]={k,v};
  for(const k of keys){ const nk=normKey(k); if(map[nk] && String(map[nk].v??'').trim()!=='') return String(map[nk].v).trim(); }
  for(const k of keys){ const nk=normKey(k); if(map[nk]) return String(map[nk].v??'').trim(); }
  return '';
}
function parseDataBr(str){
  const s=String(str||'').trim();
  let m=s.match(/(\d{1,2})[/-](\d{1,2})[/-](\d{2,4})(?:\s+(\d{1,2}):(\d{2})(?::(\d{2}))?)?/);
  if(m){ const y=m[3].length===2?('20'+m[3]):m[3]; const d=new Date(+y,+m[2]-1,+m[1],+(m[4]||0),+(m[5]||0),+(m[6]||0)); if(!isNaN(d)) return d; }
  m=s.match(/(\d{4})[/-](\d{1,2})[/-](\d{1,2})(?:[ T](\d{1,2}):(\d{2})(?::(\d{2}))?)?/);
  if(m){ const d=new Date(+m[1],+m[2]-1,+m[3],+(m[4]||0),+(m[5]||0),+(m[6]||0)); if(!isNaN(d)) return d; }
  const d=new Date(s); return isNaN(d)?null:d;
}
function parseOfflineMin(str){
  const s=norm(str);
  if(!s) return 0;
  if(s==='-'||s==='ONLINE'||s==='ON LINE') return 0;
  let min=0;
  const d=s.match(/(\d+)\s*D/); if(d) min+=+d[1]*1440;
  const h=s.match(/(\d+)\s*H/); if(h) min+=+h[1]*60;
  const m=s.match(/(\d+)\s*M/); if(m) min+=+m[1];
  if(min>0) return min;
  const hm=s.match(/(\d+):(\d+)/); if(hm) return (+hm[1]*60)+(+hm[2]);
  const n=s.match(/(\d+)/); return n?+n[1]:0;
}
function parsePct(v){
  const s=String(v??'').replace('%','').replace(',','.').trim();
  const n=parseFloat(s); return isNaN(n)?0:Math.max(0,Math.min(100,Math.round(n)));
}
function parseStatus(v){
  const s=norm(v);
  if(!s) return 'Offline';
  if(s.includes('RESOLVID') || s.includes('BAIXAD') || s.includes('CONCLUÍD') || s.includes('CONCLUID')) return 'Resolvido';
  if(s.includes('ONLINE') && !s.includes('OFFLINE')) return 'Online';
  if(s.includes('OFFLINE')) return 'Offline';
  if(s.includes('ATIVO') || s.includes('UP')) return 'Online';
  return 'Offline';
}
function linhaParaCamera(row, idx){
  const idRaw = pick(row,['ID','Id','Camera ID','Câmera ID','Codigo','Código']);
  const nome = pick(row,['Nome','Câmera / Local','Camera / Local','Camera','Local','Nome da Camera','Nome da Câmera']);
  const municipio = pick(row,['Município','Municipio','Cidade']);
  const categoria = pick(row,['Categoria','Tipo','Grupo']) || 'Municipal / Outros';
  const respRaw = pick(row,['Responsáveis','Responsaveis','Responsável','Responsavel','Responsáveis ','Contato']);
  const marcadores = pick(row,['Marcadores','Marcador','Tags','Tag']);
  const status = parseStatus(pick(row,['Status','Situação','Situacao','Estado']));
  const ultimoRaw = pick(row,['Último status','Ultimo status','Último','Ultimo','Last Status','Data Último Status','Data Ultimo Status','Atualizado em']);
  const offlineRaw = pick(row,['Tempo offline','Tempo Offline','Offline há','Tempo','Downtime']);
  const desc24 = Number(String(pick(row,['Desc. 24h','Desconexões 24h','Desconexoes 24h','Desc 24h','Desconexões'])).replace(/[^0-9-]/g,'')) || 0;
  const sla24 = parsePct(pick(row,['SLA 24h','SLA 24']));
  const slaTotal = parsePct(pick(row,['SLA total','SLA Total','SLA']));
  const dataResolucao = pick(row,['Data resolução','Data resolucao','Data da resolução','Data da resolucao']);
  const observacao = pick(row,['Observação','Observacao','Observações','Observacoes']);
  const dt = parseDataBr(ultimoRaw);
  const ultimoTs = dt ? dt.getTime() : 0;
  const ultimo = dt ? dt.toLocaleString('pt-BR') : (ultimoRaw||'');
  let offlineMin = parseOfflineMin(offlineRaw);
  if(status==='Online') offlineMin = 0;
  else if(!offlineMin && ultimoTs){ offlineMin = Math.max(0, Math.floor((Date.now()-ultimoTs)/60000)); }
  const idNum = Number(String(idRaw).replace(/[^0-9]/g,''));
  const id = idNum || (idx+1);
  const responsaveis = respRaw ? respRaw.split(/\s*[|;/•·]\s*|\s{2,}/).map(x=>x.trim()).filter(Boolean) : [];
  return {
    id, idTexto: idRaw || String(id),
    nome: nome || ('CÂMERA ' + id),
    municipio: municipio || 'SEM MUNICÍPIO',
    responsaveis, marcadores,
    categoria, status, ultimo, ultimoTs, dataResolucao, observacao,
    offlineMin, offlineStr: pendente({status}) ? fmtMin(offlineMin) : (status==='Online'?'Online':''),
    desc24, sla24, slaTotal
  };
}

/* CSV é lido linha a linha: uma aspas solta nunca pode fazer uma linha
   engolir as seguintes (foi o que gerou um nome com 2,7 milhões de caracteres). */
const MAX_CAMPO_CSV = 500;
const limiteCampo = v => String(v ?? '').slice(0, MAX_CAMPO_CSV);
function parseCsvLinhas(texto, sep){
  const linhas = [];
  let linha = [], campo = '', aspas = false;
  const fechaCampo = () => { linha.push(campo); campo = ''; };
  const fechaLinha = () => {
    aspas = false; // nunca deixa aspas abertas atravessarem para a próxima linha
    fechaCampo();
    if(linha.length > 1 && linha.some(v => String(v).trim() !== '')) linhas.push(linha);
    linha = [];
  };
  for(let i = 0; i < texto.length; i++){
    const c = texto[i];
    if(c === '"'){
      if(aspas && texto[i + 1] === '"'){ campo += '"'; i++; }
      else if(aspas) aspas = false;
      else if(campo.trim() === '') aspas = true;
      else campo += '"'; // aspas no meio do texto é conteúdo, não abertura
    } else if(c === sep && !aspas){
      fechaCampo();
    } else if(c === '\n'){
      fechaLinha();
    } else if(c !== '\r'){
      campo += c;
      if(campo.length > MAX_CAMPO_CSV * 4) campo = campo.slice(0, MAX_CAMPO_CSV * 4);
    }
  }
  if(campo !== '' || linha.length) fechaLinha();
  return linhas;
}

async function processarLeitura(){
  const inp = $('arquivoLeitura');
  const file = inp && inp.files && inp.files[0];
  if(!file){ $('leituraStatus').textContent='Selecione um arquivo .xlsx, .xls ou .csv.'; return; }
  if(window.__nocXlsxPromise) await window.__nocXlsxPromise;
  if(typeof XLSX==='undefined'){ $('leituraStatus').textContent='Biblioteca de planilhas não carregada. Verifique a conexão e tente novamente.'; return; }
  const btnSalvar=$('btnSalvarLeitura');
  if(btnSalvar)btnSalvar.disabled=true;
  $('leituraStatus').textContent='Lendo arquivo...';
  try{
    await carregarIdsCadastradas();
    const buf = await file.arrayBuffer();
    let rows=[];
    const name=file.name.toLowerCase();
    if(name.endsWith('.csv')){
      const text = new TextDecoder('utf-8').decode(buf).replace(/^\uFEFF/,'');
      const primeiraLinha = text.split(/\r?\n/,1)[0] || '';
      const separador = (primeiraLinha.match(/;/g)||[]).length > (primeiraLinha.match(/,/g)||[]).length ? ';' : ',';
      const linhas = parseCsvLinhas(text, separador);
      if(!linhas.length){ $('leituraStatus').textContent='Arquivo vazio ou formato não reconhecido.'; return; }
      const cabecalho = linhas[0].map(h => String(h).trim().replace(/^\uFEFF/,''));
      rows = linhas.slice(1).map(campos => {
        const obj = {};
        for(let i = 0; i < cabecalho.length; i++) obj[cabecalho[i] || ('COLUNA_' + (i + 1))] = limiteCampo(campos[i] ?? '');
        return obj;
      });
    } else {
      const wb = XLSX.read(buf, {type:'array'});
      const ws = wb.Sheets[wb.SheetNames[0]];
      rows = XLSX.utils.sheet_to_json(ws, {defval:''});
    }
    rows = rows.map(r => Object.fromEntries(Object.entries(r).map(([k,v]) => [k, limiteCampo(v)])));
    if(!rows.length){ $('leituraStatus').textContent='Arquivo vazio ou formato não reconhecido.'; return; }

    const lidas = rows.map((r,i)=>linhaParaCamera(r,i)).filter(r=>r.nome || r.idTexto);
    const { parsed, ignoradasCadastradas, duplicadasNoArquivo } = filtrarLinhasLidas(lidas);

    // merge por idTexto/id/nome normalizado
    const byId = new Map(data.map(d=>[normKey(String(d.idTexto||d.id)), d]));
    const byNome = new Map(data.map(d=>[norm(d.nome), d]));
    let atualizadas=0, novas=0, online=0, offline=0, resolvidas=0;
    for(const n of parsed){
      const kId=normKey(String(n.idTexto||n.id));
      const kNome=norm(n.nome);
      const ex = byId.get(kId) || byNome.get(kNome);
      if(ex){
        Object.assign(ex, n, { responsaveis: n.responsaveis.length?n.responsaveis:ex.responsaveis, marcadores: n.marcadores||ex.marcadores });
        atualizadas++;
      } else {
        data.push(n); byId.set(kId,n); byNome.set(kNome,n); novas++;
      }
      if(n.status==='Online') online++; else if(n.status==='Resolvido') resolvidas++; else offline++;
    }

    stats = calcularStats(data, { geradoEm: new Date().toLocaleString('pt-BR'), arquivoFonte: file.name });
    resumoMunicipios = calcularResumoMunicipios(data);
    PAYLOAD.stats = stats; PAYLOAD.data = data; PAYLOAD.resumoMunicipios = resumoMunicipios;
    renderDashboard();
    mostrar($('viewTabela').classList.contains('hidden') ? 'municipios' : 'tabela');

    const resumo = [
      ['Arquivo', file.name],
      ['Linhas lidas', rows.length],
      ['Câmeras processadas', parsed.length],
      ['Atualizadas', atualizadas],
      ['Novas', novas],
      ['IDs já cadastradas (ignoradas)', ignoradasCadastradas],
      ['IDs repetidas no arquivo (ignoradas)', duplicadasNoArquivo],
      ['Offline no arquivo', offline],
      ['Online no arquivo', online],
      ['Resolvidas no arquivo', resolvidas],
      ['Total no painel', data.length]
    ];
    $('leituraResumo').innerHTML = resumo.map(([k,v])=>`<tr><td><b>${esc(k)}</b></td><td>${esc(String(v))}</td></tr>`).join('');
    prepararLeituraParaSalvar(file.name);
    $('leituraStatus').textContent = `Bot concluiu a leitura. ${ignoradasCadastradas} ID(s) já cadastrada(s) e ${duplicadasNoArquivo} ID(s) repetida(s) foram ignoradas; o cadastro atual foi preservado. Clique em "Salvar e atualizar" para persistir.`;
  }catch(err){
    console.error(err);
    $('leituraStatus').textContent = 'Falha ao ler arquivo: ' + (err && err.message ? err.message : err);
  }
}

const COLUNAS_ARMAZENAMENTO = [
  'ID','Nome','Município','Categoria','Responsáveis','Marcadores','Status',
  'Data resolução','Observação','Último status','Tempo offline','Desconexões 24h','SLA 24h','SLA total'
];
function csvParaArmazenamento(){
  const citar = v => `"${String(v ?? '').replace(/"/g,'""')}"`;
  const linhas = (Array.isArray(data)?data:[]).map(d=>[
    d.idTexto || d.id,
    d.nome,
    d.municipio,
    d.categoria,
    Array.isArray(d.responsaveis) ? d.responsaveis.join(' | ') : (d.responsaveis||''),
    Array.isArray(d.marcadores) ? d.marcadores.join(' | ') : (d.marcadores||''),
    d.status,
    d.dataResolucao||'',
    d.observacao||'',
    d.ultimo,
    pendente(d) ? (d.offlineStr || fmtMin(d.offlineMin)) : (d.status==='Online'?'Online':''),
    d.desc24,
    (Number(d.sla24)||0)+'%',
    (Number(d.slaTotal)||0)+'%'
  ]);
  return [COLUNAS_ARMAZENAMENTO.join(';'), ...linhas.map(l=>l.map(citar).join(';'))].join('\r\n');
}
function prepararLeituraParaSalvar(nomeArquivo){
  leituraAtual = {
    csv: csvParaArmazenamento(),
    nomeArquivo: String(nomeArquivo || stats.arquivoFonte || 'noc-importado.csv')
  };
  const btn=$('btnSalvarLeitura');
  if(btn)btn.disabled=false;
}
function aplicarPayloadSalvo(payload, nomeArquivo){
  if(!payload || !Array.isArray(payload.data) || !payload.data.length) return false;
  data = payload.data;
  stats = payload.stats || calcularStats(data, { arquivoFonte: nomeArquivo || stats.arquivoFonte });
  resumoMunicipios = payload.resumoMunicipios || calcularResumoMunicipios(data);
  PAYLOAD.stats = stats; PAYLOAD.data = data; PAYLOAD.resumoMunicipios = resumoMunicipios;
  renderDashboard();
  mostrar($('viewTabela').classList.contains('hidden') ? 'municipios' : 'tabela');
  prepararLeituraParaSalvar(nomeArquivo || stats.arquivoFonte);
  return true;
}
async function salvarLeitura(){
  if(!leituraAtual){ $('leituraStatus').textContent='Processe um arquivo antes de salvar.'; return; }
  const btn=$('btnSalvarLeitura'), anterior=btn.textContent;
  btn.disabled=true; btn.textContent='Salvando...';
  $('leituraStatus').textContent='Salvando dados no armazenamento...';
  try{
    const corpo = JSON.stringify({ csv: leituraAtual.csv, nomeArquivo: leituraAtual.nomeArquivo });
    const opcoes = {
      method:'POST', credentials:'same-origin',
      headers:{'Content-Type':'application/json'}, body:corpo
    };
    const endpoint = window.__nocStorageEndpoint || '/api/noc/arquivos';
    let resp=null;
    try{ resp = await fetch(endpoint, opcoes); }catch(err){ resp=null; }
    // Painel standalone: o servidor local expõe POST /api/importar.
    // Só faz fallback quando a rota não existe; erros de validação devem aparecer.
    if(!resp || resp.status===404) resp = await fetch('/api/importar', opcoes);
    const json = await resp.json().catch(()=>({}));
    if(!resp.ok) throw new Error(json.erro || json.message || `Erro HTTP ${resp.status}`);
    const payload = json.payload || (json.stats && json.data ? {
      stats: json.stats, data: json.data, resumoMunicipios: json.resumoMunicipios
    } : null);
    if(payload) aplicarPayloadSalvo(payload, json.registro?.nome || leituraAtual.nomeArquivo);
    $('leituraStatus').textContent = '✅ Dados salvos no armazenamento e painel atualizado.';
    window.dispatchEvent(new CustomEvent('noc:Stored',{detail:{registro:json.registro||null}}));
  }catch(err){
    console.error(err);
    $('leituraStatus').textContent = 'Falha ao salvar: ' + (err && err.message ? err.message : err);
  }finally{
    btn.textContent=anterior; btn.disabled=false;
  }
}
if(window.__nocPayloadHandler)window.removeEventListener('noc:payload',window.__nocPayloadHandler);
window.__nocPayloadHandler = e=>{
  const detail=e.detail||{};
  if(aplicarPayloadSalvo(detail.payload, detail.registro?.nome)){
    $('leituraStatus').textContent='Dados restaurados do armazenamento.';
  }
};

let pdfScan=null;
function pdfFileToBase64(file){return new Promise((resolve,reject)=>{const r=new FileReader();r.onload=()=>{const s=String(r.result||"");resolve(s.includes(",")?s.split(",")[1]:s)};r.onerror=()=>reject(new Error("Falha ao ler arquivo"));r.readAsDataURL(file);});}
async function scanPdfDestinacao(){
 const input=document.getElementById("pdf-file");
 const file=input&&input.files&&input.files[0];
 if(!file){toast("Selecione um arquivo PDF");return;}
 if(!/\.pdf$/i.test(file.name)){toast("Selecione um arquivo .pdf");return;}
 const btn=document.getElementById("btn-pdf-scan");
 if(btn){btn.disabled=true;btn.textContent="Varrendo PDF...";}
 try{
  const pdfBase64=await pdfFileToBase64(file);
  const resp=await apiRequest("/api/import/pdf/scan",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({pdfBase64,filename:file.name})});
  pdfScan=resp.result||resp;
  pdfScan.assignments=(pdfScan.assignments||[]).map(a=>Object.assign({selected:a.action==="proposed"},a));
  toast(`Varredura concluída: ${pdfScan.detected||0} câmera(s) detectada(s), ${pdfScan.proposed||0} com sugestão de destino.`);
  draw();
 }catch(e){toast(`Falha na varredura do PDF: ${e.message}`);}
 finally{if(btn){btn.disabled=false;btn.textContent="Varrer PDF";}}
}
function togglePdfAssign(idx,checked){ if(!pdfScan||!pdfScan.assignments[idx])return; pdfScan.assignments[idx].selected=!!checked; }
function setPdfAssignField(idx,field,value){ if(!pdfScan||!pdfScan.assignments[idx])return; pdfScan.assignments[idx][field]=value; pdfScan.assignments[idx].selected=true; }
async function applyPdfDestinacao(){
 if(!pdfScan||!Array.isArray(pdfScan.assignments)) {toast("Faça a varredura do PDF antes.");return;}
 // coleta edições feitas na tabela
 document.querySelectorAll('[data-pdf-idx][data-pdf-field]').forEach(el=>{
  const idx=Number(el.getAttribute('data-pdf-idx'));
  const field=el.getAttribute('data-pdf-field');
  if(!pdfScan.assignments[idx]) return;
  pdfScan.assignments[idx][field]=el.value;
 });
 const assignments=pdfScan.assignments.filter(a=>a.selected).map(a=>({cameraId:a.cameraId,responsavel_nome:a.responsavel_nome,responsavel_telefone:a.responsavel_telefone,local:a.local}));
 if(!assignments.length){toast("Selecione ao menos uma câmera para destinar.");return;}
 if(!confirm(`Aplicar destino para ${assignments.length} câmera(s)?`)) return;
 const btn=document.getElementById("btn-pdf-apply");
 if(btn){btn.disabled=true;btn.textContent="Aplicando...";}
 try{
  const resp=await apiRequest("/api/import/pdf/apply",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({assignments})});
  const s=resp.summary||{};
  toast(`Destinação aplicada: ${s.applied||0} atualizada(s), ${s.skipped||0} ignorada(s).`);
  pdfScan=null;
  await loadState();
  draw();
 }catch(e){toast(`Falha ao aplicar destinação: ${e.message}`);}
 finally{if(btn){btn.disabled=false;btn.textContent="Aplicar destinos selecionados";}}
}

   <h2 style="font-size:15px;margin:0 0 12px">Contatos bloqueados</h2>
   ${list}
  </div>
 </div>`;
}

function painelnocView(){
 return `<div id="noc-root"></div>`;
}
function carregarScriptNOC(src){
 return new Promise(resolve=>{
  if(window.XLSX)return resolve();
  let url;
  try{ url=new URL(src,location.href).href; }catch{ return resolve(); }
  const existente=[...document.scripts].find(s=>s.src===url);
  if(existente){
   if(existente.dataset.nocState==="loaded"||existente.dataset.nocState==="error")return resolve();
   existente.addEventListener("load",()=>{existente.dataset.nocState="loaded";resolve()},{once:true});
   existente.addEventListener("error",()=>{existente.dataset.nocState="error";resolve()},{once:true});
   return;
  }
  const script=document.createElement("script");
  script.src=url; script.async=true; script.dataset.nocState="loading";
  script.onload=()=>{script.dataset.nocState="loaded";resolve()};
  script.onerror=()=>{script.dataset.nocState="error";resolve()};
  document.head.appendChild(script);
 });
}
async function restaurarUltimoArquivoNOC(montagem){
 try{
  const endpoint=window.__nocStorageEndpoint || "/api/noc/arquivos";
  const response=await fetch(endpoint+"/ultimo?t="+Date.now(),{cache:"no-store",credentials:"same-origin"});
  if(!response.ok)return;
  const json=await response.json();
  if(montagem!==nocPainelMontadoEm)return;
  if(json && json.payload)window.dispatchEvent(new CustomEvent("noc:payload",{detail:{payload:json.payload,registro:json.registro}}));
 }catch(e){}
}
function montarPainelNOC(){
 const tpl=document.getElementById("nocPainelTemplate"), host=document.getElementById("noc-root");
 if(!tpl||!host||host.shadowRoot)return;
 const shadow=host.attachShadow({mode:"open"});
 const frag=tpl.content.cloneNode(true);
 const scripts=[...frag.querySelectorAll("script")];
 const externos=[]; let codigo="";
 for(const s of scripts){
  if(s.src)externos.push(s.src);
  else codigo+=s.textContent+"\n";
  s.remove();
 }
 shadow.appendChild(frag);
 if(externos.length){
  const promessa=Promise.all(externos.map(carregarScriptNOC));
  window.__nocXlsxPromise=promessa;
  promessa.finally(()=>{ if(window.__nocXlsxPromise===promessa)delete window.__nocXlsxPromise; });
 }
 window.__nocRoot=shadow;
 const montagem=++nocPainelMontadoEm;
  try{ if(codigo)new Function(codigo)(); } finally{ delete window.__nocRoot; }
  restaurarUltimoArquivoNOC(montagem);
}

 const kp=`<div class="kpis"><div class="kpi"><b>${cams.filter(c=>c.status!=="resolvido").length}</b><span>câmeras offline</span></div><div class="kpi"><b>${new Set(cams.filter(c=>c.status!=="resolvido").map(c=>c.resp)).size}</b><span>responsáveis</span></div><div class="kpi"><b>${cams.filter(c=>c.status==="resolvido").length}</b><span>resolvidas</span></div></div>`;
 let list=ks.length?ks.map(r=>card(tab,r,g[r])).join(""):`<div class="empty">Nada por aqui. ${tab==="offline"?"Cadastre uma câmera ao lado para começar.":"Quando houver movimento, os grupos aparecem nesta aba."}</div>`;
 const side=tab==="offline"?`<div>${form()}<div style="height:16px"></div>${nocDraftView()}<div style="height:16px"></div>${preview()}</div>`:"";
 return `<h1>${T.t}</h1><p class="lead">${T.d}</p>${tab==="offline"?healthBanner():""}${kp}${tab==="offline"?`<div class="two"><div>${list}</div>${side}</div>`:list}`
}
function dash(){
 const counts={};
 cams.forEach(camera=>{counts[camera.status]=(counts[camera.status]||0)+1});
 const total=cams.length,offline=cams.filter(camera=>camera.status!=="resolvido").length;
 const resolved=cams.filter(camera=>camera.status==="resolvido").length;
 const statuses=TABS.filter(item=>["offline","notificado","analisando","aguardando","validacao","resolvido"].includes(item.k));
 const rows=statuses.map(item=>`<div class="rk"><span>${esc(item.t)}</span><i style="width:${total?Math.max((counts[item.k]||0)/total*100,2):0}%;background:var(--brand)"></i><b>${counts[item.k]||0}</b></div>`).join("");
  const step=(k,label,cor)=>`<button class="flow-step" style="--c:${cor}" onclick="go('${k}')"><b>${label}</b><span>${counts[k]||0} câmeras</span></button>`;
  const fluxo=`<div class="flow" aria-label="Fluxograma do atendimento">
   ${step("offline","Offline","var(--red)")}<span class="flow-arrow">→</span>
   ${step("notificado","Notificação","var(--amb)")}<span class="flow-arrow">→</span>
   <div class="flow-split">${step("analisando","Em análise","var(--blu)")}<span class="flow-arrow">ou</span>${step("aguardando","Falar com técnico","var(--amb)")}</div>
   <span class="flow-arrow">→</span>${step("validacao","Validar resolução","var(--amb)")}<span class="flow-arrow">→</span>${step("resolvido","Resolvido","var(--grn)")}
  </div>`;
  return `<h1>Dashboard</h1><p class="lead">Fluxograma do atendimento e situação atual das câmeras cadastradas no banco de dados. Clique em uma etapa para abrir a fila correspondente.</p>
  ${fluxo}
  <div class="kpis"><div class="kpi"><b>${total}</b><span>câmeras cadastradas</span></div><div class="kpi"><b>${offline}</b><span>não resolvidas</span></div><div class="kpi"><b>${resolved}</b><span>resolvidas</span></div><div class="kpi"><b>${Object.keys(phones).length}</b><span>responsáveis</span></div></div>
 <div class="kpis" id="dash-extra"></div>
 <div class="box"><h2>Câmeras por situação</h2>${rows||'<div class="empty">Cadastre uma câmera para começar.</div>'}</div>
 <p class="sub" style="padding:10px 0 0">O painel exibe apenas dados reais; não há histórico diário configurado para gráficos.</p>`;
}
function pushIds(){const e=$("#f-id");if(!e)return;e.value.split(/[,;\s]+/).map(x=>x.trim().toUpperCase()).filter(Boolean).forEach(i=>{if(!pend.includes(i))pend.push(i)});e.value="";draw()}
function focusId(){const e=$("#f-id");if(e)e.focus()}
function draw(){
 if(authRequired){$("#nav").innerHTML="";$("#view").innerHTML=loginView();return}
 const ICONS={dash:"bi-grid-1x2-fill",offline:"bi-exclamation-triangle-fill",notificado:"bi-bell-fill",analisando:"bi-search",aguardando:"bi-tools",validacao:"bi-check2-square",resolvido:"bi-check-circle-fill",whatsapp:"bi-whatsapp",instances:"bi-phone-fill",diag:"bi-activity",templates:"bi-file-earmark-text",reports:"bi-bar-chart-fill",painelnoc:"bi-display",botconfig:"bi-gear-fill",blocklist:"bi-slash-circle"};
 $("#nav").innerHTML=TABS.map(t=>`<button data-k="${t.k}" class="${t.k===tab?"on":""}"><span class="nav-label"><i class="bi ${ICONS[t.k]||'bi-circle'}"></i> ${t.t}</span>${(t.k==="dash"||t.k==="painelnoc")?"":`<span class="n">${new Set(cams.filter(c=>c.status===t.k).map(c=>c.resp)).size}</span>`}</button>`).join("");
 const keep=document.activeElement&&document.activeElement.id,val=keep&&document.activeElement.value;
 const storageNotice=storageMode==="memory"?'<div class="note">Armazenamento temporário em memória: configure o Postgres remoto para evitar perda de dados.</div>':"";
 $("#logout").style.display=currentUser?"block":"none";
 $("#view").innerHTML=(loadError?`<div class="note">Não foi possível carregar as câmeras: ${esc(loadError)}</div>`:"")+storageNotice+view();
  document.querySelector("main").classList.toggle("noc-full",tab==="painelnoc");
  if(tab==="painelnoc")montarPainelNOC();
 if(keep&&$("#"+CSS.escape(keep))){const e=$("#"+CSS.escape(keep));if(val!==undefined)e.value=val}
}

 nocPainelItens=Array.isArray(e.detail?.items)?e.detail.items:[];

window.addEventListener("noc:baixa",async e=>{
 const detail=e.detail||{};
 const ids=Array.isArray(detail.ids)?detail.ids:[];
 const chave=v=>String(v||'').replace(/^NOC-/i,'').replace(/[^A-Z0-9]/g,'').toUpperCase();
 const alvo=new Set(ids.map(chave).filter(Boolean));
 const encontradas=cams.filter(c=>alvo.has(chave(c.id)));
 if(!encontradas.length)return;
 const fields={status:"Resolvido",data_resolucao:detail.dataResolucao||new Date().toISOString().slice(0,10),observacoes:detail.observacao||"Baixa dada no Painel NOC"};
 try{
  await apiRequest("/api/cameras/bulk",{method:"PUT",headers:{"Content-Type":"application/json"},body:JSON.stringify({ids:encontradas.map(c=>c.id),fields})});

  await loadFromApi();
 }catch(err){toast(`Falha ao dar baixa: ${err.message}`)}
});

  if(a==="cad"){pushIds();const r2=fv.r.trim(),p=fv.p.trim();

  try{for(const id of novos)await apiRequest("/api/cameras",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({id,camera_nome:id,local:"",responsavel_nome:r2,responsavel_telefone:digits,email:"",status:"Pendente",tentativas:0,ultima_cobranca:"",data_resolucao:"",observacoes:""})});toast(`${novos.length} câmera(s) cadastrada(s) para ${r2}`);pend=[];fv={r:"",p:""};await loadFromApi()}catch(error){toast(`Falha ao cadastrar: ${error.message}`)}return}
 if(A[a])A[a](r)
});
